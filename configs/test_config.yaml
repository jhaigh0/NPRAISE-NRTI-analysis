defaults:
  l2_values: [0.62, 0.63, 0.64, 0.65]

  # Fraction of each sample that is drawn from outside the selection region.
  # This is the "background" contribution; combined with a small n_samples it
  # produces the noisy spectra needed to train the 1D CNN.
  noise_level: 0.1

  # Number of summed spectra generated for each configuration.
  n_sets: 10

  # Number of spectra summed together to make one sample. Looped over, so a
  # single run produces samples with a range of signal-to-noise ratios.
  n_samples: [10, 20, 50]

workspaces:
  - name: Ag
    workspace: ../../NPRAISE - standards/NPRAISE - standards/Normalised nGEM data/2Dmaps/Ag/Ag_normMonitor.nxs
    selections:
      - name: Ag
        selection: ../../NPRAISE - standards/NPRAISE - standards/Normalised nGEM data/2Dmaps/Ag/Ag_normMonitor_selection.nxs
        isotopes: [Ag-107, Ag-109]
        label: 0
      - name: background
        selection: ../../NPRAISE - standards/NPRAISE - standards/Normalised nGEM data/2Dmaps/Ag/Ag_normMonitor_empty_selection.nxs
        isotopes: []
        label: 1

  - name: Au
    workspace: ../../NPRAISE - standards/NPRAISE - standards/Normalised nGEM data/2Dmaps/Au/Au_1foil_normMonitor.nxs
    selections:
      - name: Au
        selection: ../../NPRAISE - standards/NPRAISE - standards/Normalised nGEM data/2Dmaps/Au/Au_1foil_normMonitor_selection_new.nxs
        isotopes: [Au-197]
        label: 1
      - name: background
        selection: ../../NPRAISE - standards/NPRAISE - standards/Normalised nGEM data/2Dmaps/Au/Au_1foil_normMonitor_empty_selection.nxs
        isotopes: []
        label: 1
